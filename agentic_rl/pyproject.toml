[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tau2-airline-agentic-rl"
version = "0.1.0"
description = "Tau2 Airline agentic RL components for veRL GRPO training"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
data = ["datasets>=3.0,<5", "pyarrow>=17"]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/tau2_agentic_rl"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
