# ProCredit v3: canonical matching, progress deduplication and local process costs.
project:
  domain: airline
  tau2_commit: a2c024725189473d2d7cea3a5cfdbcc67478e41f
  verl_commit: 483b8a009ba3a97563edee3a19887e4862b8094a
  annotation_version: v4-policy-applicability
  reward_version: v7-procredit-contracts
agent_policy:
  path: configs/prompts/areal_airline_sft.v1.json
  system_prompt_sha256: e490e0859e1357ed6dd777fdbddab15b11d6de96ff7161328a6babcab77348ab
model:
  base: Qwen/Qwen3-4B-Instruct-2507
  sft_input: ${MERGED_SFT_MODEL}
  rl_method: lora
lora:
  rank: 32
  alpha: 64
  dropout: 0.0
  target_modules: all-linear
hardware:
  gpu: 1x_A800_80GB
  tensor_parallel_size: 1
  gradient_checkpointing: true
rollout:
  tool_parser: hermes
  max_context_length: 16384
  initial_prompt_max_tokens: 8192
  max_soft_turns: 15
  max_hard_turns: 24
  reserved_observation_tokens: 1024
  reserved_template_tokens: 128
  min_final_response_tokens: 64
  per_turn_max_new_tokens: 1024
  temperature: 1.0
  top_p: 1.0
  top_k: -1
  group_size: 8
  agent_worker_count: 2
  max_active_trajectories: 2
  user_api_max_inflight: 2
  judge_api_max_inflight: 2
  vllm_max_num_seqs: 2
  queue_timeout_seconds: null
  queue_stall_timeout_seconds: 1800
user_simulator:
  provider: DeepSeek
  model: ${DEEPSEEK_USER_MODEL}
  temperature: 0.0
  thinking: disabled
  max_retries: 2
  llm_args:
    api_base: ${DEEPSEEK_BASE_URL}
    timeout: 120
    extra_body:
      thinking:
        type: disabled
judge:
  enabled: true
  provider: DeepSeek
  model: ${DEEPSEEK_JUDGE_MODEL}
  base_url: ${DEEPSEEK_BASE_URL}
  calls_per_trajectory: 1
  output_schema_version: '1.0'
  max_retries: 2
user_sim_filter:
  enabled: true
  provider: DeepSeek
  model: ${DEEPSEEK_USER_SIM_JUDGE_MODEL}
  base_url: ${DEEPSEEK_BASE_URL}
  max_retries: 2
  max_resamples: 2
  version: user-sim-compliance-v1
annotations:
  required_actions: data/annotations/airline_required_actions.train.v1.json
  action_dependencies: data/annotations/airline_action_dependencies.train.v1.json
  semantic_checks: data/annotations/airline_semantic_checks.train.v1.json
  transfer_rules: data/annotations/airline_transfer_rules.train.v1.json
  policy_rules: data/annotations/airline_mandatory_policy_rules.train.v1.json
reward:
  truncation_multiplier: 0.75
  mandatory_policy_gate: true
  task_safety_gate: true
  process_penalty_cap: 0.2
  over_turn_penalty_cap: 0.08
  process_penalties:
    parse_error: 0.1
    unknown_tool: 0.1
    schema_invalid: 0.08
    model_caused_execution_error: 0.08
    multiple_tool_calls: 0.0
    mixed_content_and_tool_call: 0.1
    unchanged_retry: 0.06
    duplicate_no_progress: 0.03
    extra_assistant_turn: 0.02
  mode: strict_progress_v1
  progress_scale: 0.5
  progress_version: progress-v2
  score_floor: 0.0
  penalty_placement: outside_truncation
algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  clip_ratio_low: 0.2
  clip_ratio_high: 0.28
  clip_ratio_c: 10.0
  loss_agg_mode: token-mean
  entropy_coeff: 0.0
  grad_clip: 1.0
  use_kl_in_reward: false
  use_kl_loss: false
  kl_coef: 0.0
ppo:
  old_log_probs_source: vllm_rollout
  ppo_epochs: 2
  effective_trajectory_mini_batch_size: 32
  verl_ppo_mini_batch_size_prompts: 4
  ppo_micro_batch_size_per_gpu: 1
  log_prob_micro_batch_size_per_gpu: 1
optimizer:
  lr: 5.0e-06
dynamic_sampling:
  enable: true
  metric: train_reward
  train_batch_size: 4
  conceptual_gen_batch_size: 8
  group_size: 8
  max_num_gen_batches: 3
  max_rollouts_per_optimizer_step: 192
  criterion: final_advantage_nonzero
  signal_tolerance: 1.0e-08
vllm:
  gpu_memory_utilization: 0.4
outputs:
  trajectories: ${TRAJECTORY_OUTPUT_DIR:-outputs/runs/unset/trajectories}
  checkpoints: ${CHECKPOINT_OUTPUT_DIR:-outputs/runs/unset/checkpoints}
  judge_cache: ${JUDGE_CACHE_DIR:-outputs/runs/unset/judge_cache}
  user_cache: ${USER_CACHE_DIR:-outputs/runs/unset/user_cache}
  user_sim_judge_cache: ${USER_SIM_JUDGE_CACHE_DIR:-outputs/runs/unset/user_sim_judge_cache}
  metrics: ${METRICS_OUTPUT_DIR:-outputs/runs/unset/metrics}
  reports: ${REPORTS_OUTPUT_DIR:-outputs/runs/unset/reports}
credit:
  mode: procredit_turn
  version: procredit-turn-v3
  gamma: 1.0
  turn_coefficient: 1.0
  turn_centering: policy_attributed_turn_mean
  trajectory_std: population
  epsilon: 1.0e-06
  process_penalty_in_turn_return: false
  violation_penalty: 1.0
  unresolved_policy_credit: no_positive_progress

  process_credit: capped_local_max
training_selection:
  mode: verified_progress
precision:
  model_dtype: bfloat16
  param_dtype: bfloat16
  rollout_dtype: bfloat16
  reduce_dtype: float32
  buffer_dtype: float32
