# ProCredit v4: immediate progress and independent refusal credit.
profile_status: candidate
project:
  domain: airline
  tau2_commit: a2c024725189473d2d7cea3a5cfdbcc67478e41f
  verl_commit: 483b8a009ba3a97563edee3a19887e4862b8094a
  annotation_version: v7-repaired-airline-train30
  reward_version: v13.2-procredit-task-routed-v1
agent_policy:
  path: configs/prompts/airline_sft_v4_single_tool.v1.json
  system_prompt_sha256: 54c8a8153c0f9fe4d2bc4d57a3698221d09388d84245afdcc253378ee4238cb2
model:
  base: Qwen/Qwen3-4B-Instruct-2507
  sft_input: ${MERGED_SFT_MODEL}
  rl_method: lora
lora:
  rank: 32
  alpha: 64
  dropout: 0.0
  target_modules: all-linear
hardware:
  gpu: 1x_A800_80GB
  tensor_parallel_size: 1
  gradient_checkpointing: true
rollout:
  max_tool_calls_per_turn: 1
  tool_parser: hermes
  max_context_length: 24576
  initial_prompt_max_tokens: 24576
  max_soft_turns: 35
  max_hard_turns: 35
  temperature: 1.0
  top_p: 1.0
  top_k: -1
  group_size: 8
  agent_worker_count: 8
  max_active_trajectories: 32
  user_api_max_inflight: 32
  judge_api_max_inflight: 32
  vllm_max_num_seqs: 32
  queue_timeout_seconds: null
  queue_stall_timeout_seconds: 1800
user_simulator:
  provider: DeepSeek
  model: ${DEEPSEEK_USER_MODEL}
  temperature: 0.0
  thinking: disabled
  max_retries: 2
  llm_args:
    api_base: ${DEEPSEEK_BASE_URL}
    timeout: 120
    extra_body:
      thinking:
        type: disabled
judge:
  enabled: true
  mode: trajectory_routed_v1
  provider: DeepSeek
  model: ${DEEPSEEK_JUDGE_MODEL}
  base_url: ${DEEPSEEK_BASE_URL}
  calls_per_trajectory: 1  # Each scoring round requests a single complete verdict.
  output_schema_version: '1.0'
  max_retries: 2
user_sim_filter:
  enabled: false
  provider: DeepSeek
  model: ${DEEPSEEK_USER_SIM_JUDGE_MODEL}
  base_url: ${DEEPSEEK_BASE_URL}
  max_retries: 2
  max_resamples: 2
  version: user-sim-compliance-v1
annotations:
  required_actions: data/annotations/airline_required_actions.train.repaired.v1.json
  action_dependencies: data/annotations/airline_action_dependencies.train.v1.json
  semantic_checks: data/annotations/airline_semantic_checks.train.repaired.v1.json
  judge_routes: data/annotations/airline_judge_routes.train.v1.json
  transfer_rules: data/annotations/airline_transfer_rules.train.v1.json
  policy_rules: data/annotations/airline_mandatory_policy_rules.train.v1.json
reward:
  truncation_multiplier: 0.0
  truncation_policy: zero-trajectory-v1
  mandatory_policy_gate: false
  task_safety_gate: false
  check_reference_write_scope: false
  process_penalties:
    parse_error: 0.1
    unknown_tool: 0.1
    schema_invalid: 0.08
    model_caused_execution_error: 0.08
    multiple_tool_calls: 0.0
    mixed_content_and_tool_call: 0.1
    unchanged_retry: 0.06
    duplicate_no_progress: 0.03
    extra_assistant_turn: 0.02
  mode: turn_local_v1
  progress_scale: 0.5
  task_score_mode: official_semantic_progress_v1
  progress_version: progress-v3
  transfer_validation_version: transfer-policy-v2
  duplicate_query_version: duplicate-query-v1
  score_floor: 0.0
  penalty_placement: turn_only
algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  clip_ratio_low: 0.2
  clip_ratio_high: 0.28
  clip_ratio_c: 10.0
  loss_agg_mode: token-mean
  entropy_coeff: 0.0
  grad_clip: 1.0
  use_kl_in_reward: false
  use_kl_loss: false
  kl_coef: 0.0
ppo:
  old_log_probs_source: vllm_rollout
  ppo_epochs: 1
  max_tokens_per_microbatch: 32768
  effective_trajectory_mini_batch_size: 32
  verl_ppo_mini_batch_size_prompts: 4
  ppo_micro_batch_size_per_gpu: 1
  log_prob_micro_batch_size_per_gpu: 1
optimizer:
  lr: 5.0e-06
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-08
  lr_scheduler_type: constant
dynamic_sampling:
  enable: true
  metric: train_reward
  train_batch_size: 4  # At most four groups per update; preserve smaller remainders at the cap.
  conceptual_gen_batch_size: 4  # Start with 32 slots; subsequent waves fill only missing groups.
  group_size: 8  # Logical slots; exhausted transient slots do not invalidate scored siblings.
  max_num_gen_batches: 3
  max_rollouts_per_optimizer_step: 96  # Worst-case logical slots across all three waves; replacements counted separately.
  criterion: final_advantage_nonzero
  signal_tolerance: 1.0e-08
vllm:
  gpu_memory_utilization: 0.70
outputs:
  trajectories: ${TRAJECTORY_OUTPUT_DIR:-outputs/runs/unset/trajectories}
  checkpoints: ${CHECKPOINT_OUTPUT_DIR:-outputs/runs/unset/checkpoints}
  judge_cache: ${JUDGE_CACHE_DIR:-outputs/runs/unset/judge_cache}
  user_cache: ${USER_CACHE_DIR:-outputs/runs/unset/user_cache}
  user_sim_judge_cache: ${USER_SIM_JUDGE_CACHE_DIR:-outputs/runs/unset/user_sim_judge_cache}
  metrics: ${METRICS_OUTPUT_DIR:-outputs/runs/unset/metrics}
  reports: ${REPORTS_OUTPUT_DIR:-outputs/runs/unset/reports}
credit:
  mode: procredit_turn
  version: procredit-turn-v4
  final_turn_rule: simple-turn-v2
  progress_credit: immediate_delta_v1
  db_subgoal_credit: null  # Opt in with db_subgoal_local_v1; scalar reward stays unchanged.
  post_completion_credit: null  # Opt in with post_completion_regression_v1.
  gamma: 1.0
  turn_coefficient: 1.0
  turn_centering: none
  trajectory_std: population
  epsilon: 1.0e-06
  process_penalty_in_turn_return: false
  violation_penalty: 1.0
  unresolved_policy_credit: retry_frozen
  violation_sign: strictly_negative

  process_credit: uncapped_local_additive
training_selection:
  mode: task_or_local_credit
  split_file: data/splits/airline_repaired_train30.v1.json
  task_repairs: task_repairs/tasks.json
precision:
  model_dtype: bfloat16
  lora_master_dtype: float32
  param_dtype: bfloat16
  rollout_dtype: bfloat16
  reduce_dtype: float32
  buffer_dtype: float32

slot_recovery:
  max_truncation_resamples: 2
  max_resamples: 2
  max_scoring_retries: 2
  on_exhaustion: salvage_group
