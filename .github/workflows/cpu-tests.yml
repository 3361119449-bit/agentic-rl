name: CPU regression and Qwen tokenizer

on:
  push:
    branches: [main]
    paths: ['agentic_rl/**', 'training/qwen3_4b_sft/**', '.github/workflows/cpu-tests.yml']
  pull_request:
    paths: ['agentic_rl/**', 'training/qwen3_4b_sft/**', '.github/workflows/cpu-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      QWEN_TOKENIZER_PATH: /tmp/agentic-rl-qwen-tokenizer
    defaults:
      run:
        working-directory: agentic_rl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies (no model weights, GPU or API key)
        run: python -m pip install -e '.[test]' transformers==4.57.1 jinja2 ruff==0.16.6
      - name: Fetch pinned real Qwen tokenizer
        run: >-
          python -c "import os; from huggingface_hub import snapshot_download;
          snapshot_download('Qwen/Qwen3-4B-Instruct-2507',
          revision='cdbee75f17c01a7cc42f958dc650907174af0554',
          local_dir=os.environ['QWEN_TOKENIZER_PATH'],
          allow_patterns=['tokenizer*', '*.jinja', 'config.json', 'special_tokens_map.json'])"
      - name: Lint
        run: python -m ruff check src scripts tests
      - name: Run CPU and real-tokenizer regressions
        run: python -m pytest -ra

  real-verl-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: src
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    defaults:
      run:
        working-directory: agentic_rl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Checkout exact veRL source
        run: |
          git clone --filter=blob:none https://github.com/verl-project/verl.git /tmp/verl-contract
          git -C /tmp/verl-contract checkout 483b8a009ba3a97563edee3a19887e4862b8094a
      - name: Install real dependency stack (no weights, generation or API calls)
        run: |
          python -m pip install --no-cache-dir -e '.[test]' -e '/tmp/verl-contract' 'vllm==0.18.0' 'TransferQueue==0.1.8'
          python -m pip check
          python -m pip freeze
      - name: Real runner import, Hydra validation and multi-worker concurrency
        run: python -m pytest contract_tests -v --tb=short
