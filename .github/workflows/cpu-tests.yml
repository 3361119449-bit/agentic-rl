name: CPU regression and Qwen tokenizer

on:
  push:
    branches: [main]
    paths: ['agentic_rl/**', 'training/qwen3_4b_sft/**', 'training/tau2_rollout_sft/**', '.github/workflows/cpu-tests.yml']
  pull_request:
    paths: ['agentic_rl/**', 'training/qwen3_4b_sft/**', 'training/tau2_rollout_sft/**', '.github/workflows/cpu-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: CPU and tokenizer (Transformers ${{ matrix.transformers }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        transformers: ['4.57.1', '5.10.4']
    env:
      PYTHONPATH: src
      QWEN_TOKENIZER_PATH: /tmp/agentic-rl-qwen-tokenizer
    defaults:
      run:
        working-directory: agentic_rl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies (no model weights, GPU or API key)
        run: python -m pip install -e '.[test]' 'transformers==${{ matrix.transformers }}' jinja2 ruff==0.16.6
      - name: Fetch pinned real Qwen tokenizer
        run: >-
          python -c "import os; from huggingface_hub import snapshot_download;
          snapshot_download('Qwen/Qwen3-4B-Instruct-2507',
          revision='cdbee75f17c01a7cc42f958dc650907174af0554',
          local_dir=os.environ['QWEN_TOKENIZER_PATH'],
          allow_patterns=['tokenizer*', '*.jinja', 'config.json', 'special_tokens_map.json'])"
      - name: Lint
        run: python -m ruff check --config pyproject.toml src scripts tests sft_contract_tests ../training/qwen3_4b_sft
      - name: Run CPU and real-tokenizer regressions
        run: python -m pytest -ra

  real-verl-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: src
      QWEN_TOKENIZER_PATH: /tmp/rl-qwen-tokenizer
    defaults:
      run:
        working-directory: agentic_rl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Checkout exact veRL source
        run: |
          git clone --filter=blob:none https://github.com/verl-project/verl.git /tmp/verl-contract
          git -C /tmp/verl-contract checkout 483b8a009ba3a97563edee3a19887e4862b8094a
      - name: Install real dependency stack (no weights, generation or API calls)
        run: |
          python -m pip install --no-cache-dir -e '.[test]' -e '/tmp/verl-contract' 'vllm==0.24.0' 'TransferQueue==0.1.8'
          python -m pip check
          python -m pip freeze
      - name: Fetch pinned Qwen tokenizer for the actual resolved RL stack
        run: >-
          python -c "import os; from huggingface_hub import snapshot_download;
          snapshot_download('Qwen/Qwen3-4B-Instruct-2507',
          revision='cdbee75f17c01a7cc42f958dc650907174af0554',
          local_dir=os.environ['QWEN_TOKENIZER_PATH'],
          allow_patterns=['tokenizer*', '*.jinja', 'config.json', 'special_tokens_map.json'])"
      - name: Real runner import, Hydra validation and multi-worker concurrency
        env:
          HF_HUB_OFFLINE: '1'
        run: python -m pytest contract_tests tests/test_qwen_chat_stream.py -v --tb=short

  real-sft-lora-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      RUN_REAL_SFT_CONTRACT: '1'
      SFT_VERL_ROOT: /tmp/verl-sft-contract
      QWEN_TOKENIZER_PATH: /tmp/sft-qwen-tokenizer
    defaults:
      run:
        working-directory: agentic_rl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the isolated pinned SFT CPU dependency stack
        run: |
          git clone --filter=blob:none https://github.com/verl-project/verl.git "$SFT_VERL_ROOT"
          git -C "$SFT_VERL_ROOT" checkout bec9ef74768dd201881cd4e54cd0385e87caae27
          python -m pip install 'torch==2.9.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]' -e "$SFT_VERL_ROOT" 'transformers==4.57.1' 'peft==0.17.1' 'torchdata==0.11.0' 'tensordict==0.10.0'
          python -m pip check
      - name: Fetch tokenizer only, no model weights
        run: >-
          python -c "import os; from huggingface_hub import snapshot_download;
          snapshot_download('Qwen/Qwen3-4B-Instruct-2507',
          revision='cdbee75f17c01a7cc42f958dc650907174af0554',
          local_dir=os.environ['QWEN_TOKENIZER_PATH'],
          allow_patterns=['tokenizer*', '*.jinja', 'config.json', 'special_tokens_map.json'])"
      - name: Real SFT imports, Hydra, Parquet, masks and epoch resume contracts
        env:
          HF_HUB_OFFLINE: '1'
        run: python -m pytest sft_contract_tests -v --tb=short
