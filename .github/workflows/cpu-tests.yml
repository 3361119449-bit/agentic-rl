name: CPU regression and Qwen tokenizer

on:
  push:
    branches: [main]
    paths: ['agentic_rl/**', 'training/qwen3_4b_sft/**', '.github/workflows/cpu-tests.yml']
  pull_request:
    paths: ['agentic_rl/**', 'training/qwen3_4b_sft/**', '.github/workflows/cpu-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      QWEN_TOKENIZER_PATH: /tmp/agentic-rl-qwen-tokenizer
    defaults:
      run:
        working-directory: agentic_rl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies (no model weights, GPU or API key)
        run: python -m pip install -e '.[test]' transformers==4.57.1 jinja2 ruff==0.16.6
      - name: Fetch pinned real Qwen tokenizer
        run: >-
          python -c "import os; from huggingface_hub import snapshot_download;
          snapshot_download('Qwen/Qwen3-4B-Instruct-2507',
          revision='cdbee75f17c01a7cc42f958dc650907174af0554',
          local_dir=os.environ['QWEN_TOKENIZER_PATH'],
          allow_patterns=['tokenizer*', '*.jinja', 'config.json', 'special_tokens_map.json'])"
      - name: Lint
        run: python -m ruff check src scripts tests
      - name: Run CPU and real-tokenizer regressions
        run: python -m pytest -ra
